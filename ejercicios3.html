<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Ejercicios de Programación</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom scrollbar styles */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        .dark ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        .code-font {
            font-family: 'Fira Code', monospace;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full flex flex-col font-sans transition-colors duration-200">

    <!-- Top Header Navigation -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-sky-500 to-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid font-bold fa-code text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-slate-900 dark:text-white">CodeExercise Hub</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Practica y resuelve problemas de código</p>
                </div>
            </div>

            <!-- Header Actions -->
            <div class="flex items-center gap-2 sm:gap-4">
                <button id="grid-view-btn" title="Ver lista de ejercicios" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-sky-600 dark:hover:text-sky-400 hover:bg-slate-100 dark:hover:bg-slate-700/60 rounded-lg transition-colors">
                    <i class="fa-solid fa-th-large"></i>
                    <span class="hidden md:inline">Ver Todos</span>
                </button>

                <button id="add-custom-btn" class="flex items-center gap-2 px-3 py-2 text-sm font-medium bg-sky-500 hover:bg-sky-600 text-white rounded-lg shadow-sm hover:shadow transition-all">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">Nuevo Ejercicio</span>
                </button>

                <div class="h-6 w-px bg-slate-200 dark:bg-slate-700 mx-1"></div>

                <!-- Dark Mode Toggle -->
                <button id="theme-toggle" title="Cambiar Tema" class="p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors">
                    <i id="theme-toggle-dark-icon" class="fa-solid fa-moon text-lg hidden"></i>
                    <i id="theme-toggle-light-icon" class="fa-solid fa-sun text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 flex flex-col gap-6">

        <!-- Exercise Controls Top Bar -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700/80 shadow-sm flex flex-wrap items-center justify-between gap-4">
            
            <!-- Navigation buttons -->
            <div class="flex items-center gap-2">
                <button id="prev-btn" class="flex items-center gap-2 px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 text-sm font-semibold rounded-xl transition-all disabled:opacity-40 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-chevron-left"></i>
                    <span class="hidden sm:inline">Anterior</span>
                </button>
                <button id="next-btn" class="flex items-center gap-2 px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 text-sm font-semibold rounded-xl transition-all disabled:opacity-40 disabled:cursor-not-allowed">
                    <span class="hidden sm:inline">Siguiente</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <!-- Current Indicator & Jump Menu -->
            <div class="flex items-center gap-3">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500">Ejercicio</span>
                <select id="exercise-select" class="bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-slate-800 dark:text-slate-100 text-sm font-medium rounded-xl px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none cursor-pointer max-w-[200px] sm:max-w-xs truncate">
                    <!-- Dynamic options injected here -->
                </select>
                <span id="counter-badge" class="text-xs px-2.5 py-1 bg-slate-100 dark:bg-slate-700 font-mono rounded-full text-slate-600 dark:text-slate-300 font-medium">
                    1 / 1
                </span>
            </div>

            <!-- Quick Status Actions -->
            <div class="flex items-center gap-2">
                <button id="toggle-favorite-btn" title="Guardar como favorito" class="p-2 text-slate-400 hover:text-amber-500 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                    <i class="fa-regular fa-star text-lg"></i>
                </button>
                <button id="toggle-solved-btn" title="Marcar como resuelto" class="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-emerald-50 dark:hover:bg-emerald-950/30 transition-all">
                    <i class="fa-regular fa-circle-check text-base text-slate-400"></i>
                    <span id="solved-text" class="hidden md:inline">Sin Resolver</span>
                </button>
            </div>
        </div>

        <!-- Exercise Main Display Card -->
        <div id="exercise-card" class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700/80 shadow-md overflow-hidden flex flex-col transition-all">
            
            <!-- Card Header Header -->
            <div class="p-6 sm:p-8 border-b border-slate-100 dark:border-slate-700/60 bg-gradient-to-r from-slate-50/50 to-white dark:from-slate-800 dark:to-slate-800/50">
                <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
                    <div class="flex items-center gap-2 flex-wrap" id="tags-container">
                        <!-- Badges injected dynamically -->
                    </div>
                    <span id="difficulty-badge" class="px-3 py-1 text-xs font-bold rounded-full uppercase tracking-wider">
                        Fácil
                    </span>
                </div>

                <h2 id="ex-title" class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">
                    Cargando título...
                </h2>
            </div>

            <!-- Statement Section -->
            <div class="p-6 sm:p-8 space-y-6">
                <div>
                    <h3 class="text-xs font-bold text-sky-600 dark:text-sky-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-align-left"></i>
                        Enunciado del Problema
                    </h3>
                    <div id="ex-description" class="text-slate-700 dark:text-slate-200 text-base sm:text-lg leading-relaxed whitespace-pre-line space-y-2">
                        <!-- Description content -->
                    </div>
                </div>

                <!-- Input and Expected Output Section -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
                    
                    <!-- Example Input Box -->
                    <div class="flex flex-col bg-slate-900 text-slate-100 rounded-xl overflow-hidden shadow-inner border border-slate-800">
                        <div class="px-4 py-2.5 bg-slate-950/80 border-b border-slate-800 flex items-center justify-between">
                            <span class="text-xs font-semibold text-slate-400 tracking-wider uppercase flex items-center gap-2">
                                <i class="fa-solid fa-arrow-right-to-bracket text-sky-400"></i>
                                Entrada de Ejemplo
                            </span>
                            <button id="copy-input-btn" class="px-2.5 py-1 text-xs font-medium text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 rounded transition-colors flex items-center gap-1.5">
                                <i class="fa-regular fa-copy"></i>
                                <span>Copiar</span>
                            </button>
                        </div>
                        <div class="p-4 flex-1 overflow-x-auto">
                            <pre><code id="ex-input" class="code-font text-sm text-sky-300 whitespace-pre-wrap"></code></pre>
                        </div>
                    </div>

                    <!-- Expected Output Box -->
                    <div class="flex flex-col bg-slate-900 text-slate-100 rounded-xl overflow-hidden shadow-inner border border-slate-800">
                        <div class="px-4 py-2.5 bg-slate-950/80 border-b border-slate-800 flex items-center justify-between">
                            <span class="text-xs font-semibold text-slate-400 tracking-wider uppercase flex items-center gap-2">
                                <i class="fa-solid fa-arrow-right-from-bracket text-emerald-400"></i>
                                Salida Esperada
                            </span>
                            <button id="copy-output-btn" class="px-2.5 py-1 text-xs font-medium text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 rounded transition-colors flex items-center gap-1.5">
                                <i class="fa-regular fa-copy"></i>
                                <span>Copiar</span>
                            </button>
                        </div>
                        <div class="p-4 flex-1 overflow-x-auto">
                            <pre><code id="ex-output" class="code-font text-sm text-emerald-300 whitespace-pre-wrap"></code></pre>
                        </div>
                    </div>

                </div>

            </div>

        </div>

        <!-- Shortcut info -->
        <div class="flex items-center justify-between text-xs text-slate-400 dark:text-slate-500 px-2">
            <span>Usa las teclas <kbd class="px-1.5 py-0.5 bg-slate-200 dark:bg-slate-800 rounded text-slate-700 dark:text-slate-300">←</kbd> y <kbd class="px-1.5 py-0.5 bg-slate-200 dark:bg-slate-800 rounded text-slate-700 dark:text-slate-300">→</kbd> del teclado para navegar entre ejercicios.</span>
        </div>

    </main>

    <!-- All Exercises List Modal -->
    <div id="list-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">
            <div class="p-5 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between bg-slate-50 dark:bg-slate-800">
                <h3 class="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-sky-500"></i>
                    Lista Completa de Ejercicios
                </h3>
                <button id="close-list-modal" class="text-slate-400 hover:text-slate-600 dark:hover:text-white p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="p-4 border-b border-slate-100 dark:border-slate-700/50">
                <input id="search-exercise-input" type="text" placeholder="Buscar ejercicio por nombre o palabra clave..." class="w-full bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 text-sm rounded-xl px-4 py-2.5 border-none focus:ring-2 focus:ring-sky-500 focus:outline-none">
            </div>
            <div id="exercise-grid-list" class="p-4 overflow-y-auto space-y-2 flex-1">
                <!-- Injected dynamically -->
            </div>
        </div>
    </div>

    <!-- Add Custom Exercise Modal -->
    <div id="add-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-200 dark:border-slate-700 p-6 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-3">
                <h3 class="font-bold text-lg text-slate-900 dark:text-white">Agregar Nuevo Ejercicio</h3>
                <button id="close-add-modal" class="text-slate-400 hover:text-slate-600 dark:hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form id="add-exercise-form" class="space-y-4 text-xs sm:text-sm">
                <div>
                    <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Título del Ejercicio</label>
                    <input type="text" id="new-title" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Dificultad</label>
                        <select id="new-difficulty" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 focus:ring-2 focus:ring-sky-500 focus:outline-none">
                            <option value="Fácil">Fácil</option>
                            <option value="Medio">Medio</option>
                            <option value="Difícil">Difícil</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Categoría</label>
                        <input type="text" id="new-category" placeholder="Ej: Arreglos, Strings" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Enunciado</label>
                    <textarea id="new-description" rows="3" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
                </div>

                <div>
                    <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Entrada de Ejemplo</label>
                    <textarea id="new-input" rows="2" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 code-font focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
                </div>

                <div>
                    <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Salida Esperada</label>
                    <textarea id="new-output" rows="2" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 code-font focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
                </div>

                <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2.5 rounded-lg transition-colors shadow">
                    Guardar Ejercicio
                </button>
            </form>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <script>
        // Initial Dataset of Exercises: Módulo de Ejercicios - Listas + Bucles + Fundamentos
        const defaultExercises = [
            {
                id: "ex-listas-1",
                title: "1. Registrador y Buscador de Nombres",
                difficulty: "Fácil",
                category: "Listas y Búsqueda",
                description: "Diseña un programa que permita registrar una lista de asistentes a un evento y luego verificar si alguien está en la lista.\n\nRequisitos:\n• Solicita al usuario cuántas personas desea registrar (N).\n• Mediante un bucle for, pide los N nombres y agrégalos a una lista utilizando .append().\n• Muestra la lista completa de asistentes e imprime cuántos asistentes hay en total usando len().\n• Pide al usuario que ingrese un nombre para buscar. Mediante una condición if / else y el operador in, muestra si la persona está o no registrada.",
                input: "Cantidad de asistentes (N): 3\nNombre 1: Ana\nNombre 2: Carlos\nNombre 3: María\n\nBuscar nombre: Carlos",
                output: "--- LISTA DE ASISTENTES ---\n['Ana', 'Carlos', 'María']\nTotal de asistentes: 3\n\n--- BÚSQUEDA ---\nBuscando a: Carlos\nResultado: Carlos SÍ está registrado en la lista del evento."
            },
            {
                id: "ex-listas-2",
                title: "2. Separador de Números Pares e Impares",
                difficulty: "Fácil",
                category: "Listas y Filtrado",
                description: "Solicita números al usuario, clasifícalos en dos listas independientes y muestra estadísticas básicas.\n\nRequisitos:\n• Crea dos listas vacías: pares e impares.\n• Pide al usuario que ingrese 8 números enteros utilizando un bucle for.\n• Evalúa cada número con el operador módulo %:\n  - Si es par, agrégalo a la lista pares.\n  - Si es impar, agrégalo a la lista impares.\n• Al finalizar la lectura, imprime ambas listas y muestra cuál de las dos tiene más elementos.",
                input: "Ingresa 8 números enteros:\n4, 7, 12, 15, 8, 21, 30, 9",
                output: "--- RESULTADO DE CLASIFICACIÓN ---\nLista de Pares: [4, 12, 8, 30] (Total: 4)\nLista de Impares: [7, 15, 21, 9] (Total: 4)\n\nComparación: Ambas listas tienen la misma cantidad de elementos."
            },
            {
                id: "ex-listas-3",
                title: "3. Administrador de Tareas (Lista de Pendientes)",
                difficulty: "Medio",
                category: "Listas y Menú Interactivo",
                description: "Crea un gestor de tareas sencillo por consola utilizando un bucle while interactivo y la estructura match / case.\n\nRequisitos:\n• Mantiene una lista tareas vacía dentro de un bucle while True.\n• Despliega el siguiente menú:\n  1 - Agregar tarea.\n  2 - Mostrar todas las tareas (con su número de posición/índice).\n  3 - Eliminar tarea por su posición.\n  4 - Salir.\n• Usa match / case para procesar la opción:\n  - Caso 1: Solicita el nombre de la tarea y agrégala con .append().\n  - Caso 2: Si la lista está vacía, indica que no hay tareas. Si no, usa un for con enumerate() o un contador para mostrar las tareas numeradas (ej. 1. Comprar leche).\n  - Caso 3: Pide el número de tarea a eliminar, valida que la posición exista y elimínala con .pop() o del.\n  - Caso 4: Finaliza el programa.",
                input: "Opción: 1 -> Tarea: \"Comprar leche\"\nOpción: 1 -> Tarea: \"Estudiar Python\"\nOpción: 2\nOpción: 3 -> Número a eliminar: 1\nOpción: 2\nOpción: 4",
                output: "--- TAREAS REGISTRADAS ---\n1. Comprar leche\n2. Estudiar Python\n\nEliminando tarea #1: Comprar leche\n\n--- TAREAS ACTUALIZADAS ---\n1. Estudiar Python\n\n¡Saliendo del administrador de tareas!"
            },
            {
                id: "ex-listas-4",
                title: "4. Filtro de Calificaciones y Calificación Media",
                difficulty: "Medio",
                category: "Listas y Estadística",
                description: "Procesa un listado de notas de un grupo de estudiantes para calcular la media e identificar quiénes aprobaron.\n\nRequisitos:\n• Solicita al usuario que ingrese notas (float entre 0 y 100) una a una dentro de un bucle while. Para terminar la carga, el usuario debe ingresar -1.\n• Almacena cada nota válida en una lista calificaciones.\n• Calcula y muestra el promedio general de las notas de la lista.\n• Crea una nueva lista llamada aprobados que contenga solo las notas mayores o iguales a 60.\n• Imprime la cantidad de aprobados y la nota más alta registrada (usando la función max()).",
                input: "Notas ingresadas: 85.0, 42.5, 90.0, 58.0, 76.5, -1",
                output: "--- RESUMEN DE CALIFICACIONES ---\nLista de notas: [85.0, 42.5, 90.0, 58.0, 76.5]\nPromedio general: 70.4\n\n--- ESTUDIANTES APROBADOS ---\nNotas aprobatorias (>=60): [85.0, 90.0, 76.5]\nTotal aprobados: 3 de 5\nNota máxima alcanzada: 90.0"
            },
            {
                id: "ex-listas-5",
                title: "5. Limpieza de Datos (Eliminar Duplicados)",
                difficulty: "Medio",
                category: "Listas y Algoritmos",
                description: "Desarrolla un algoritmo que reciba una lista de datos ingresados por el usuario y elimine los elementos repetidos sin alterar el orden original.\n\nRequisitos:\n• Pide al usuario que ingrese 10 palabras o elementos (pueden repetirse) y almacénalos en una lista llamada datos_crudos.\n• Crea una lista vacía llamada datos_limpios.\n• Recorre datos_crudos elemento por elemento con un bucle for.\n• Si el elemento no está en datos_limpios, agrégalo.\n• Muestra la lista original, la lista sin duplicados y cuántos elementos repetidos se eliminaron (len(datos_crudos) - len(datos_limpios)).",
                input: "10 Elementos: [\"python\", \"java\", \"python\", \"c++\", \"java\", \"html\", \"css\", \"html\", \"python\", \"sql\"]",
                output: "--- DEPURACIÓN DE DATOS ---\nLista original: ['python', 'java', 'python', 'c++', 'java', 'html', 'css', 'html', 'python', 'sql']\nLista limpia (sin duplicados): ['python', 'java', 'c++', 'html', 'css', 'sql']\n\nResumen: Se eliminaron 4 elementos duplicados."
            },
            {
                id: "ex-listas-6",
                title: "6. Ordenador y Buscador de Precios (Listas Paralelas)",
                difficulty: "Medio",
                category: "Listas Paralelas e Índices",
                description: "Modela el catálogo de productos de una tienda usando dos listas sincronizadas (una para nombres y otra para precios).\n\nRequisitos:\n• Pide al usuario que registre 5 productos con su respectivo precio (float). Guarda los nombres en productos y los precios en precios.\n• Muestra la lista de productos junto con su precio formateado (ej. Teclado: $25.0).\n• Encuentra el producto más caro y el más barato sin usar funciones avanzadas de ordenamiento: localiza el índice del precio máximo y mínimo con precios.index(max(precios)) e imprime el nombre del producto correspondiente.\n• Solicita un presupuesto máximo al usuario y muestra únicamente los productos cuyo precio sea menor o igual a ese monto.",
                input: "Productos y Precios:\n1. Laptop: 850.0\n2. Mouse: 15.0\n3. Teclado: 35.0\n4. Monitor: 200.0\n5. Auriculares: 45.0\n\nPresupuesto máximo: 100.0",
                output: "--- CATÁLOGO DE PRODUCTOS ---\n• Laptop: $850.0\n• Mouse: $15.0\n• Teclado: $35.0\n• Monitor: $200.0\n• Auriculares: $45.0\n\nProducto más caro: Laptop ($850.0)\nProducto más barato: Mouse ($15.0)\n\n--- PRODUCTOS DENTRO DEL PRESUPUESTO ($100.0) ---\n• Mouse: $15.0\n• Teclado: $35.0\n• Auriculares: $45.0"
            },
            {
                id: "ex-listas-7",
                title: "7. Inversor de Listas y Verificador de Palíndromos",
                difficulty: "Medio",
                category: "Listas, Slicing y Cadenas",
                description: "Determina si una palabra o frase ingresada por el usuario es un palíndromo (se lee igual de izquierda a derecha que de derecha a izquierda) convirtiéndola en una lista de caracteres.\n\nRequisitos:\n• Solicita al usuario una palabra o frase.\n• Elimina los espacios en blanco y convierte el texto a minúsculas.\n• Convierte la cadena limpia en una lista de caracteres individualmente (list(texto)).\n• Crea una copia invertida de la lista (puedes usar slicing lista[::-1] o el método .reverse()).\n• Compara mediante un if / else la lista original con la lista invertida.\n• Muestra un mensaje indicando si es o no un palíndromo, mostrando ambas listas en pantalla.",
                input: "Frase ingresada: \"Anilina\"",
                output: "--- ANÁLISIS PALÍNDROMO ---\nTexto original: \"Anilina\"\nLista de caracteres: ['a', 'n', 'i', 'l', 'i', 'n', 'a']\nLista invertida:    ['a', 'n', 'i', 'l', 'i', 'n', 'a']\n\nResultado: ¡Es un PALÍNDROMO!"
            },
            {
                id: "ex-listas-8",
                title: "8. Simulador de Carrito de Compras con Inventario",
                difficulty: "Difícil",
                category: "Listas y Control de Stock",
                description: "Crea un sistema de ventas donde el usuario selecciona productos de una lista disponible para añadirlos a su carrito.\n\nRequisitos:\n• Define una lista preexistente con los productos disponibles en la tienda: inventario = [\"laptop\", \"mouse\", \"teclado\", \"monitor\", \"auriculares\"].\n• Inicializa una lista vacía llamada carrito.\n• En un bucle while:\n  - Muestra el inventario disponible.\n  - Pide al usuario que escriba el nombre del producto que desea comprar o \"pagar\" para finalizar.\n  - Si el producto ingresado está en inventario, agrégalo al carrito y remuévelo de inventario (para simular que se agota el stock).\n  - Si no está en inventario, muestra un mensaje de \"Producto no disponible o agotado\".\n• Al escribir \"pagar\", muestra el resumen final con los productos contenidos en el carrito.",
                input: "Acciones:\n1. Comprar \"mouse\"\n2. Comprar \"monitor\"\n3. Comprar \"mouse\" (agotado)\n4. Escribir \"pagar\"",
                output: "--- TIENDA EN LÍNEA ---\nAgregado 'mouse' al carrito.\nAgregado 'monitor' al carrito.\n'mouse' no disponible o agotado.\n\n--- RESUMEN DE COMPRA ---\nProductos comprados: ['mouse', 'monitor']\nTotal de artículos: 2\nInventario restante: ['laptop', 'teclado', 'auriculares']"
            },
            {
                id: "ex-listas-9",
                title: "9. Analizador de Frecuencia de Datos (Moda Básica)",
                difficulty: "Difícil",
                category: "Listas y Frecuencias (.count)",
                description: "Identifica qué elemento se repite más veces dentro de un conjunto de datos ingresados por el usuario.\n\nRequisitos:\n• Pide al usuario que ingrese una serie de números enteros (mínimo 8 números).\n• Guarda los números en una lista numeros.\n• Encuentra cuál es el número que se repite con mayor frecuencia (la moda):\n  - Recorre la lista de elementos únicos.\n  - Usa el método .count() sobre la lista original para saber cuántas veces aparece cada número.\n  - Mantén el registro del número más frecuente y su cantidad de apariciones.\n• Muestra la lista completa, cuántas veces se repite el número más frecuente y cuál es dicho número.",
                input: "Números ingresados: 5, 2, 8, 5, 3, 5, 2, 9, 5, 1",
                output: "--- ANÁLISIS DE FRECUENCIAS ---\nLista de números: [5, 2, 8, 5, 3, 5, 2, 9, 5, 1]\nElementos únicos evaluados: [5, 2, 8, 3, 9, 1]\n\nNúmero más frecuente (Moda): 5\nFrecuencia de apariciones: 4 veces"
            },
            {
                id: "ex-listas-10",
                title: "10. Control de Acceso y Colas (Estructura tipo FIFO / LIFO)",
                difficulty: "Difícil",
                category: "Estructuras de Datos y Colas",
                description: "Diseña un simulador de gestión de turnos para un banco o centro de atención utilizando listas.\n\nRequisitos:\n• Diseña un programa que mantenga una lista cola_clientes vacía.\n• Despliega un menú continuo (while) con las opciones:\n  1 - Llegada de cliente (añadir al final de la cola).\n  2 - Atender cliente (atender al primero de la fila y removerlo).\n  3 - Colar cliente prioritario (insertar al inicio de la fila usando .insert(0, cliente)).\n  4 - Mostrar estado actual de la cola.\n  5 - Cerrar sistema.\n• Procesa cada opción con match / case:\n  - En la opción 2 (Atender): Valida si hay clientes. Si los hay, elimina y muestra al cliente atendido usando .pop(0). Si la lista está vacía, avisa que no hay nadie en espera.\n  - En la opción 4 (Mostrar): Muestra el listado en orden de turno e indica el tiempo estimado de espera (asumiendo 3 minutos por cliente en la cola: len(cola_clientes) * 3).",
                input: "Opción: 1 -> Cliente: \"Juan\"\nOpción: 1 -> Cliente: \"María\"\nOpción: 3 -> Cliente: \"Don Roberto (Prioritario)\"\nOpción: 4\nOpción: 2\nOpción: 5",
                output: "--- SISTEMA DE GESTIÓN DE TURNOS ---\nCliente 'Juan' añadido a la fila.\nCliente 'María' añadida a la fila.\nCliente 'Don Roberto (Prioritario)' insertado al inicio.\n\n--- ESTADO DE LA COLA ---\nTurnos: ['Don Roberto (Prioritario)', 'Juan', 'María']\nPersonas en espera: 3\nTiempo estimado de espera: 9 minutos\n\nAtendiendo a: Don Roberto (Prioritario)\n\n¡Sistema de atención cerrado!"
            }
        ];

        // App State - Load default exercises or custom ones stored
        let exercises = JSON.parse(localStorage.getItem('code_exercises_listas_v1')) || defaultExercises;
        let currentIndex = 0;
        let solvedMap = JSON.parse(localStorage.getItem('solved_exercises_listas')) || {};
        let favoritesMap = JSON.parse(localStorage.getItem('favorite_exercises_listas')) || {};

        // DOM Elements
        const exTitle = document.getElementById('ex-title');
        const exDescription = document.getElementById('ex-description');
        const exInput = document.getElementById('ex-input');
        const exOutput = document.getElementById('ex-output');
        const difficultyBadge = document.getElementById('difficulty-badge');
        const tagsContainer = document.getElementById('tags-container');
        const counterBadge = document.getElementById('counter-badge');
        const exerciseSelect = document.getElementById('exercise-select');

        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        const copyInputBtn = document.getElementById('copy-input-btn');
        const copyOutputBtn = document.getElementById('copy-output-btn');

        const toggleSolvedBtn = document.getElementById('toggle-solved-btn');
        const solvedText = document.getElementById('solved-text');
        const toggleFavBtn = document.getElementById('toggle-favorite-btn');

        // Modals
        const gridViewBtn = document.getElementById('grid-view-btn');
        const listModal = document.getElementById('list-modal');
        const closeListModal = document.getElementById('close-list-modal');
        const exerciseGridList = document.getElementById('exercise-grid-list');
        const searchInput = document.getElementById('search-exercise-input');

        const addCustomBtn = document.getElementById('add-custom-btn');
        const addModal = document.getElementById('add-modal');
        const closeAddModal = document.getElementById('close-add-modal');
        const addForm = document.getElementById('add-exercise-form');

        // Theme Toggle
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        // Core Render Function
        function renderExercise() {
            const current = exercises[currentIndex];
            if (!current) return;

            // Basic Info
            exTitle.textContent = current.title;
            exDescription.textContent = current.description;
            exInput.textContent = current.input;
            exOutput.textContent = current.output;

            // Difficulty styling
            let diffStyle = "bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-300";
            if (current.difficulty === "Medio") {
                diffStyle = "bg-amber-100 text-amber-800 dark:bg-amber-900/50 dark:text-amber-300";
            } else if (current.difficulty === "Difícil") {
                diffStyle = "bg-rose-100 text-rose-800 dark:bg-rose-900/50 dark:text-rose-300";
            }
            difficultyBadge.className = `px-3 py-1 text-xs font-bold rounded-full uppercase tracking-wider ${diffStyle}`;
            difficultyBadge.textContent = current.difficulty;

            // Tags
            tagsContainer.innerHTML = `
                <span class="px-2.5 py-1 text-xs font-medium bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-md flex items-center gap-1">
                    <i class="fa-solid fa-tag text-[10px] text-sky-500"></i> ${current.category || 'General'}
                </span>
            `;

            // Counter Badge
            counterBadge.textContent = `${currentIndex + 1} / ${exercises.length}`;

            // Buttons state
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === exercises.length - 1;

            // Select Dropdown Sync
            populateSelectOptions();
            exerciseSelect.value = currentIndex;

            // Solved Status UI
            updateSolvedUI(current.id);

            // Favorite Status UI
            updateFavoriteUI(current.id);
        }

        function populateSelectOptions() {
            exerciseSelect.innerHTML = '';
            exercises.forEach((ex, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                const isDone = solvedMap[ex.id] ? '✓ ' : '';
                opt.textContent = `${isDone}${idx + 1}. ${ex.title.replace(/^\d+\.\s*/, '')}`;
                exerciseSelect.appendChild(opt);
            });
        }

        function updateSolvedUI(id) {
            const isSolved = !!solvedMap[id];
            if (isSolved) {
                toggleSolvedBtn.className = "flex items-center gap-2 px-3 py-1.5 text-xs font-semibold rounded-xl bg-emerald-500 text-white shadow-sm transition-all";
                toggleSolvedBtn.querySelector('i').className = "fa-solid fa-circle-check text-base text-white";
                solvedText.textContent = "Resuelto";
            } else {
                toggleSolvedBtn.className = "flex items-center gap-2 px-3 py-1.5 text-xs font-semibold rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-emerald-50 dark:hover:bg-emerald-950/30 transition-all";
                toggleSolvedBtn.querySelector('i').className = "fa-regular fa-circle-check text-base text-slate-400";
                solvedText.textContent = "Sin Resolver";
            }
        }

        function updateFavoriteUI(id) {
            const isFav = !!favoritesMap[id];
            if (isFav) {
                toggleFavBtn.innerHTML = `<i class="fa-solid fa-star text-lg text-amber-500"></i>`;
            } else {
                toggleFavBtn.innerHTML = `<i class="fa-regular fa-star text-lg text-slate-400"></i>`;
            }
        }

        // Toast Notification System
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            let bg = 'bg-slate-800 text-white';
            let icon = 'fa-circle-info text-sky-400';

            if (type === 'success') {
                bg = 'bg-emerald-900 text-emerald-100 border border-emerald-700';
                icon = 'fa-circle-check text-emerald-400';
            } else if (type === 'error') {
                bg = 'bg-rose-900 text-rose-100 border border-rose-700';
                icon = 'fa-triangle-exclamation text-rose-400';
            }

            toast.className = `${bg} px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 text-xs sm:text-sm font-medium transition-all transform translate-y-2 opacity-0 duration-200 z-50`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i><span>${message}</span>`;

            const container = document.getElementById('toast-container');
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // Copy Clipboard Helper using standard execCommand fallback for iFrame compatibility
        function copyToClipboard(text, label) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-9999px';
            document.body.appendChild(textArea);
            textArea.select();

            try {
                document.execCommand('copy');
                showToast(`${label} copiada al portapapeles`, 'success');
            } catch (err) {
                showToast('Error al copiar al portapapeles', 'error');
            } finally {
                document.body.removeChild(textArea);
            }
        }

        // Event Listeners
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderExercise();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < exercises.length - 1) {
                currentIndex++;
                renderExercise();
            }
        });

        exerciseSelect.addEventListener('change', (e) => {
            currentIndex = parseInt(e.target.value);
            renderExercise();
        });

        copyInputBtn.addEventListener('click', () => {
            copyToClipboard(exInput.textContent, 'Entrada de ejemplo');
        });

        copyOutputBtn.addEventListener('click', () => {
            copyToClipboard(exOutput.textContent, 'Salida esperada');
        });

        toggleSolvedBtn.addEventListener('click', () => {
            const currentId = exercises[currentIndex].id;
            solvedMap[currentId] = !solvedMap[currentId];
            localStorage.setItem('solved_exercises_fundamentos', JSON.stringify(solvedMap));
            updateSolvedUI(currentId);
            populateSelectOptions();
            showToast(solvedMap[currentId] ? 'Marcado como Resuelto' : 'Marcado como Sin Resolver');
        });

        toggleFavBtn.addEventListener('click', () => {
            const currentId = exercises[currentIndex].id;
            favoritesMap[currentId] = !favoritesMap[currentId];
            localStorage.setItem('favorite_exercises_fundamentos', JSON.stringify(favoritesMap));
            updateFavoriteUI(currentId);
            showToast(favoritesMap[currentId] ? 'Agregado a Favoritos' : 'Eliminado de Favoritos');
        });

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            // Prevent if user is typing in input or textarea
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
                return;
            }
            if (e.key === 'ArrowLeft' && currentIndex > 0) {
                currentIndex--;
                renderExercise();
            } else if (e.key === 'ArrowRight' && currentIndex < exercises.length - 1) {
                currentIndex++;
                renderExercise();
            }
        });

        // Grid View Modal
        gridViewBtn.addEventListener('click', () => {
            renderModalGrid();
            listModal.classList.remove('hidden');
        });

        closeListModal.addEventListener('click', () => {
            listModal.classList.add('hidden');
        });

        function renderModalGrid(searchTerm = '') {
            exerciseGridList.innerHTML = '';
            const filtered = exercises.filter(ex => 
                ex.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                ex.category.toLowerCase().includes(searchTerm.toLowerCase())
            );

            if (filtered.length === 0) {
                exerciseGridList.innerHTML = `<p class="text-center py-6 text-slate-400 text-sm">No se encontraron ejercicios con ese criterio.</p>`;
                return;
            }

            filtered.forEach((ex) => {
                const originalIndex = exercises.findIndex(e => e.id === ex.id);
                const isSolved = solvedMap[ex.id];
                const isFav = favoritesMap[ex.id];

                const item = document.createElement('div');
                item.className = `p-3 rounded-xl border ${originalIndex === currentIndex ? 'border-sky-500 bg-sky-50/50 dark:bg-sky-950/20' : 'border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800'} hover:border-sky-400 transition-all cursor-pointer flex items-center justify-between gap-3`;
                
                item.innerHTML = `
                    <div class="flex items-center gap-3 truncate">
                        <span class="w-6 text-center text-xs font-bold text-slate-400">${originalIndex + 1}</span>
                        <div class="truncate">
                            <h4 class="font-semibold text-sm text-slate-800 dark:text-slate-100 truncate flex items-center gap-2">
                                ${ex.title.replace(/^\d+\.\s*/, '')}
                                ${isFav ? '<i class="fa-solid fa-star text-amber-500 text-xs"></i>' : ''}
                            </h4>
                            <span class="text-xs text-slate-400">${ex.category} • ${ex.difficulty}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        ${isSolved ? '<span class="text-xs px-2 py-0.5 rounded bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-300 font-medium">Resuelto</span>' : ''}
                        <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
                    </div>
                `;

                item.addEventListener('click', () => {
                    currentIndex = originalIndex;
                    renderExercise();
                    listModal.classList.add('hidden');
                });

                exerciseGridList.appendChild(item);
            });
        }

        searchInput.addEventListener('input', (e) => {
            renderModalGrid(e.target.value);
        });

        // Add Custom Exercise
        addCustomBtn.addEventListener('click', () => {
            addModal.classList.remove('hidden');
        });

        closeAddModal.addEventListener('click', () => {
            addModal.classList.add('hidden');
        });

        addForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const newEx = {
                id: 'custom-' + Date.now(),
                title: `${exercises.length + 1}. ${document.getElementById('new-title').value}`,
                difficulty: document.getElementById('new-difficulty').value,
                category: document.getElementById('new-category').value || 'Personalizado',
                description: document.getElementById('new-description').value,
                input: document.getElementById('new-input').value,
                output: document.getElementById('new-output').value
            };

            exercises.push(newEx);
            localStorage.setItem('code_exercises_listas_v1', JSON.stringify(exercises));
            
            addModal.classList.add('hidden');
            addForm.reset();
            
            currentIndex = exercises.length - 1;
            renderExercise();
            showToast('¡Nuevo ejercicio agregado con éxito!', 'success');
        });

        // Theme Mode Setup
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            darkIcon.classList.remove('hidden');
            lightIcon.classList.add('hidden');
        } else {
            document.documentElement.classList.remove('dark');
            lightIcon.classList.remove('hidden');
            darkIcon.classList.add('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            darkIcon.classList.toggle('hidden');
            lightIcon.classList.toggle('hidden');

            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        });

        // App Initialization
        window.onload = function() {
            renderExercise();
        };
    </script>
</body>
</html>
